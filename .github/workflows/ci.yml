name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: CI=true npx react-scripts test --watchAll=false
      - name: Production build
        # CI=true makes the build fail on any lint warning.
        run: CI=true npm run build
      - name: Upload production build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    # @firebase/rules-unit-testing drives the real rules engine through the
    # local Firestore emulator, which needs a JVM. firebase-tools 15+
    # requires Java 21+ (ubuntu-latest ships 17), so pin 21 here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Start Firestore emulator
        run: |
          npx firebase emulators:start --only firestore \
            --project demo-clacton-events > firebase-emulator.log 2>&1 &
          echo "Waiting for the emulator on 127.0.0.1:18081..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:18081/; then
              echo "Emulator is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Firestore emulator did not start in time"
          cat firebase-emulator.log
          exit 1
      - name: Run Firestore rules tests
        run: node firebase/firestore.rules.test.js
      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-log
          path: firebase-emulator.log
